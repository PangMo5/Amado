name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "27.2"

      - uses: jdx/mise-action@v5.2.5

      - name: Check project generation, formatting, and shared-core tests
        run: make generate-check format-check test-package

      - name: Resolve pinned Swift packages
        run: make install

      - name: Test macOS agent
        run: |
          xcodebuild test \
            -workspace Amado.xcworkspace \
            -scheme Amado \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iPhone, Watch, and Widget containers
        run: |
          xcodebuild build \
            -workspace Amado.xcworkspace \
            -scheme AmadoiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO
